  /api/v1/employees/{employee_pk}/times:
    get:
      operationId: employees_times_list
      description: '`busy` is the employee''s shifts across every job they hold. `free`
        is the complement of those blocks within the 00:00-23:59 window, reported
        only for days the employee already works.'
