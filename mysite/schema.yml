                      date: '2026-09-07'
                      starting_time: 08:00:00
                      finishing_time: '16:00:00'
                      role: Manager
                      brand: Bean & Board
                    free:
                    - date: '2026-09-07'
                      starting_time: 00:00:00
                      finishing_time: 08:00:00
                    - date: '2026-09-07'
                      starting_time: '16:00:00'
                      finishing_time: '23:59:00'
