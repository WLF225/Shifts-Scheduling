components:
  schemas:
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        location:
          type: string
      required:
      - id
      - location
      - name
    BrandRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 255
      required:
      - location
      - name
    BusyBlock:
      type: object
      properties:
        shift_id:
          type: integer
        date:
          type: string
          format: date
          nullable: true
        starting_time:
          type: string
          format: time
        finishing_time:
          type: string
          format: time
        role:
          type: string
          nullable: true
        brand:
          type: string
          nullable: true
      required:
      - brand
      - date
      - finishing_time
      - role
      - shift_id
      - starting_time
    CreatePersonRequest:
      type: object
      properties:
        name:
          type: string
          description: Required. The whole payload.
          maxLength: 100
      required:
      - name
    EmployRequest:
      type: object
      properties:
        employee_id:
          type: integer
          description: 'Required. An **existing** employee, created beforehand via
            `POST /api/v1/employees`. Alias: `employee`.'
        roles:
          type: string
          description: 'Required. The position to employ them in, created on first
            use. Aliases: `role`, `position`.'
          maxLength: 100
        status:
          type: string
          description: Optional; defaults to `active`.
          maxLength: 50
      required:
      - employee_id
      - roles
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
      required:
      - id
      - name
    EmployeeTimes:
      type: object
      properties:
        busy:
          type: array
          items:
            $ref: '#/components/schemas/BusyBlock'
        free:
          type: array
          items:
            $ref: '#/components/schemas/FreeBlock'
        employee_id:
          type: integer
      required:
      - employee_id
    Employment:
      type: object
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        job:
          $ref: '#/components/schemas/Job'
      required:
      - employee
      - job
    FreeBlock:
      type: object
      properties:
        date:
          type: string
          format: date
          nullable: true
        starting_time:
          type: string
          format: time
        finishing_time:
          type: string
          format: time
      required:
      - date
      - finishing_time
      - starting_time
    JWT:
      type: object
      description: Serializer for JWT authentication.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserDetails'
      required:
      - access
      - refresh
      - user
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand_id:
          type: integer
        employee_id:
          type: integer
        position_id:
          type: integer
        role:
          type: string
          nullable: true
          description: The position's name.
        status:
          type: string
      required:
      - brand_id
      - employee_id
      - id
      - position_id
      - role
      - status
    Login:
      type: object
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        password:
          type: string
      required:
      - password
    NotFoundError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PasswordChange:
      type: object
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
      required:
      - new_password1
      - new_password2
    PasswordReset:
      type: object
      description: Serializer for requesting a password reset e-mail.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    PasswordResetConfirm:
      type: object
      description: Serializer for confirming a password reset attempt.
      properties:
        new_password1:
          type: string
          maxLength: 128
        new_password2:
          type: string
          maxLength: 128
        uid:
          type: string
        token:
          type: string
      required:
      - new_password1
      - new_password2
      - token
      - uid
    PatchedUserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
          minLength: 1
        email:
          type: string
          format: email
        password1:
          type: string
          writeOnly: true
        password2:
          type: string
          writeOnly: true
      required:
      - password1
      - password2
      - username
    ResendEmailVerification:
      type: object
      properties:
        email:
          type: string
          format: email
    RestAuthDetail:
      type: object
      properties:
        detail:
          type: string
          readOnly: true
      required:
      - detail
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        schedule_id:
          type: integer
      required:
      - id
      - name
      - schedule_id
    RoleRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
      required:
      - name
    Schedule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand_id:
          type: integer
        starting_date:
          type: string
          format: date
      required:
      - brand_id
      - id
      - starting_date
    ScheduleRequest:
      type: object
      properties:
        starting_date:
          type: string
          description: 'Required. Accepts D/M/YYYY or YYYY-MM-DD. Alias: `date`.'
      required:
      - starting_date
    Shift:
      type: object
      properties:
        shift_id:
          type: integer
        job_id:
          type: integer
          nullable: true
        employee_id:
          type: integer
          nullable: true
        employee:
          type: string
          nullable: true
        role_id:
          type: integer
        role:
          type: string
          nullable: true
        schedule_id:
          type: integer
          nullable: true
        brand_id:
          type: integer
          nullable: true
        brand:
          type: string
          nullable: true
        date:
          type: string
          format: date
          nullable: true
        starting_time:
          type: string
          format: time
          nullable: true
        finishing_time:
          type: string
          format: time
          nullable: true
      required:
      - brand
      - brand_id
      - date
      - employee
      - employee_id
      - finishing_time
      - job_id
      - role
      - role_id
      - schedule_id
      - shift_id
      - starting_time
    ShiftCreateRequest:
      type: object
      properties:
        date:
          type: string
          description: 'Required. D/M/YYYY or YYYY-MM-DD. Must fall inside the schedule''s
            week - `[starting_date, starting_date + 6 days]`, inclusive. Alias: `starting_date`.'
        starting_time:
          type: string
          description: 'Required. Bare integer hours are accepted, so `8` means 08:00
            and `24` means 23:59. Alias: `start_time`.'
        finishing_time:
          type: string
          description: 'Required, and must be after `starting_time`. Bare integer
            hours are accepted, so `8` means 08:00 and `24` means 23:59. Aliases:
            `finish_time`, `ending_time`.'
      required:
      - date
      - finishing_time
      - starting_time
    ShiftUpdateRequest:
      type: object
      properties:
        date:
          type: string
          description: 'Optional, but the whole time triple must be valid if any of
            the three is sent, and the new date must fall inside the schedule''s week
            - `[starting_date, starting_date + 6 days]`, inclusive. Alias: `starting_date`.'
        starting_time:
          type: string
          description: 'Optional. Bare integer hours are accepted, so `8` means 08:00
            and `24` means 23:59. Alias: `start_time`.'
        finishing_time:
          type: string
          description: 'Optional. Bare integer hours are accepted, so `8` means 08:00
            and `24` means 23:59. Aliases: `finish_time`, `ending_time`.'
        employee_id:
          type: integer
          nullable: true
          description: Staffs the shift with this employee's job at the role's brand.
            Send explicit `null` to unstaff.
        job_id:
          type: integer
          nullable: true
          description: Staffs the shift with this job directly; takes precedence over
            `employee_id`, which must agree if also sent.
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TokenVerify:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
      required:
      - token
    UpdateEmploymentRequest:
      type: object
      properties:
        roles:
          type: string
          description: 'New position, created on first use. Aliases: `role`, `position`.'
          maxLength: 100
        status:
          type: string
          description: New job status, e.g. `active` or `terminated`.
          maxLength: 50
    UserDetails:
      type: object
      description: User model w/o password
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - pk
      - username
    ValidationError:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    VerifyEmail:
      type: object
      properties:
        key:
          type: string
          writeOnly: true
      required:
      - key
  securitySchemes:
    jwtCookieAuth:
      type: apiKey
      in: cookie
      name: access
    jwtHeaderAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
