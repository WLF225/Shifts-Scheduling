  /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles/{role_pk}/shifts:
    get:
      operationId: brands_schedules_roles_shifts_list
      description: 'Scoped to whichever parent the URL names, most specific first:
        an employee listing is that person''s calendar, a role listing is one slot''s
        history. Those are the only two mounts - there is no unscoped or schedule-level
        shift listing.'
      summary: List shifts
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: role_pk
        schema:
          type: integer
        description: Primary key of the role in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Shift'
          description: ''
    post:
      operationId: brands_schedules_roles_shifts_create
      description: 'Creates the slot with nobody on it: `POST /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles/{role_pk}/shifts`.
        All three time fields are required, and `date` must fall inside the week the
        schedule covers - `[starting_date, starting_date + 6 days]`, inclusive, anchored
        to that schedule''s own start day whatever weekday it is. Sending `employee_id`
        or `job_id` is a 400 - staff the slot with a follow-up PUT.'
      summary: Create an unstaffed shift slot
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: role_pk
        schema:
          type: integer
        description: Primary key of the role in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftCreateRequest'
            examples:
              IntegerHours:
                value:
                  date: 7/9/2026
                  starting_time: 8
                  finishing_time: 16
                summary: Integer hours
              ISODateAndHH:MM:
                value:
                  starting_date: '2026-09-07'
                  start_time: 08:30
                  ending_time: '16:30'
                summary: ISO date and HH:MM
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftCreateRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: Slot created; `job_id` and `employee_id` are null.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                DateOutsideTheScheduleWeek:
                  value:
                    error: 2026-09-03 is outside the schedule week [2026-09-04, 2026-09-10]
                  summary: Date outside the schedule week
                StaffingRejectedOnCreate:
                  value:
                    error: A shift is created unassigned; PUT /api/v1/brands/1/schedules/1/roles/1/shifts/<shift_id>
                      to staff it
                  summary: Staffing rejected on create
          description: A time field is missing or unparseable, the span is empty,
            the date falls outside the schedule's week, `employee_id`/`job_id` was
            sent, or no role is in the URL.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: The role or schedule named in the URL does not exist.
  /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles/{role_pk}/shifts/{id}:
    get:
      operationId: brands_schedules_roles_shifts_retrieve
      description: Scoped to whichever parents the URL names. A shift reached through
        the wrong role, schedule or employee is a 404, not a 200 - the URL asserts
        where the row lives.
      summary: Retrieve a shift
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the addressed row.
        required: true
      - in: path
        name: role_pk
        schema:
          type: integer
        description: Primary key of the role in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: No such shift, or not under these parents.
    put:
      operationId: brands_schedules_roles_shifts_update
      description: |-
        The one write on an existing slot: `PUT /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles/{role_pk}/shifts/{id}`.

        - **Retime**: send the complete time triple. A partial triple is a 400.
        - **Staff**: send `employee_id` (or `job_id`). Four rules apply - the job must belong to the role's brand, its position must match the role's name, it must be `active`, and the employee must be free across every job they hold.
        - **Unstaff**: send every staffing key you include as `null`. No rules apply; taking someone off a shift cannot create a clash.
        - **Neither key**: the existing assignment is left alone.

        A mix of null and non-null staffing keys is a 400, not a guess. Retiming and staffing in one call is validated against the new span.
      summary: Retime, staff, or unstaff a shift
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the addressed row.
        required: true
      - in: path
        name: role_pk
        schema:
          type: integer
        description: Primary key of the role in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftUpdateRequest'
            examples:
              StaffByEmployee:
                value:
                  employee_id: 1
                summary: Staff by employee
              RetimeAndStaffAtOnce:
                value:
                  date: 7/9/2026
                  starting_time: 9
                  finishing_time: 17
                  employee_id: 1
                summary: Retime and staff at once
              Unstaff:
                value:
                  employee_id: null
              ContradictoryStaffing:
                value:
                  employee_id: null
                  job_id: 7
                summary: Contradictory staffing
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ShiftUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShiftUpdateRequest'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shift'
          description: The updated shift.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                RetimedOutsideTheScheduleWeek:
                  value:
                    error: 2026-09-11 is outside the schedule week [2026-09-04, 2026-09-10]
                  summary: Retimed outside the schedule week
                ContradictoryStaffingRejected:
                  value:
                    error: 'Contradictory staffing: employee_id is null but job_id
                      is 7. Send every one of job_id, employee_id as null to unstaff
                      this shift, or send only the one that names who should work
                      it'
                  summary: Contradictory staffing rejected
          description: Contradictory staffing (some keys null, others not), a partial
            time triple, an empty span, a date outside the schedule's week, an ineligible
            job, or an overlapping booking.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: No such shift under the role named in the URL.
