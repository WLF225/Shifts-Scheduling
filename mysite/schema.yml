openapi: 3.0.3
info:
  title: Brand Scheduling API
  version: 1.0.0
  description: |-
    Shift scheduling across brands. A brand employs people through Jobs, opens a Schedule, and fills it with Roles; each Role holds Shifts, which are created unstaffed and staffed by a later PUT once the employee is eligible and free.

    Two conventions worth knowing before reading the operations below:

    - Dates accept `D/M/YYYY` as well as ISO `YYYY-MM-DD`, and times accept bare integer hours, so `8` means 08:00. Body keys are matched case-insensitively and several have aliases, noted per field.
    - The two failure shapes differ: a 400 answers `{"error": "..."}` while a 404 answers `{"detail": "..."}`.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Check the credentials and return the REST Token
        if the credentials are valid and authenticated.
        Calls Django Auth login method to register User ID
        in Django session framework

        Accept the following POST parameters: username, password
        Return the REST Framework Token Object's key.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWT'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Calls Django logout method and delete the Token object
        assigned to the current User object.

        Accepts/Returns nothing.
      tags:
      - auth
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        Calls Django Auth SetPasswordForm save method.

        Accepts the following POST parameters: new_password1, new_password2
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        Calls Django Auth PasswordResetForm save method.

        Accepts the following POST parameters: email
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordReset'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordReset'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: |-
        Password reset e-mail link is confirmed, therefore
        this resets the user's password.

        Accepts the following POST parameters: token, uid,
            new_password1, new_password2
        Returns the success/fail message.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/registration/:
    post:
      operationId: auth_registration_create
      description: |-
        Registers a new user.

        Accepts the following POST parameters: username, email, password1, password2.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWT'
          description: ''
  /api/v1/auth/registration/resend-email/:
    post:
      operationId: auth_registration_resend_email_create
      description: |-
        Resends another email to an unverified email.

        Accepts the following POST parameter: email.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendEmailVerification'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/registration/verify-email/:
    post:
      operationId: auth_registration_verify_email_create
      description: |-
        Verifies the email associated with the provided key.

        Accepts the following POST parameter: key.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyEmail'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestAuthDetail'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/v1/auth/user/:
    get:
      operationId: auth_user_retrieve
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    put:
      operationId: auth_user_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDetails'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserDetails'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserDetails'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
    patch:
      operationId: auth_user_partial_update
      description: |-
        Reads and updates UserModel fields
        Accepts GET, PUT, PATCH methods.

        Default accepted fields: username, first_name, last_name
        Default display fields: pk, username, email, first_name, last_name
        Read-only fields: pk, email

        Returns UserModel fields.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserDetails'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserDetails'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserDetails'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetails'
          description: ''
  /api/v1/brands:
    get:
      operationId: brands_list
      description: Every brand. An empty result is an empty list, not a 404.
      summary: List brands
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
          description: ''
    post:
      operationId: brands_create
      description: Both `name` and `location` are required. `location` is NOT NULL
        at the column, so omitting it is a 400 rather than a 500.
      summary: Create a brand
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandRequest'
            examples:
              CreateABrand:
                value:
                  name: Bean & Board
                  location: 12 Nile St, Cairo
                summary: Create a brand
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BrandRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BrandRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: Brand created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                MissingLocation:
                  value:
                    error: location is required
                  summary: Missing location
          description: '`name` or `location` is missing or blank.'
  /api/v1/brands/{brand_pk}/employees:
    get:
      operationId: brands_employees_list
      description: Every employee, or just those employed by one brand when mounted
        under a brand. An empty result is an empty list, not a 404.
      summary: List employees
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
          description: ''
    post:
      operationId: brands_employees_create
      description: |-
        Creates **only** the Job linking an existing person to this brand. It does not create the Employee - `employee_id` must name someone already recorded via `POST /api/v1/employees`, and an unknown id is a 404.

        One person may hold more than one job at the same brand (Cook *and* Cashier), so employing someone already employed here is a normal 201 producing a second Job, not a conflict. The same person may equally hold jobs at several brands.
      summary: Employ an existing person at a brand
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployRequest'
            examples:
              EmployAsABarista:
                value:
                  employee_id: 7
                  roles: Barista
                summary: Employ as a barista
              ExplicitStatus:
                value:
                  employee_id: 7
                  role: Cashier
                  status: active
                summary: Explicit status
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmployRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmployRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employment'
          description: The new Job, with the person it employs.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                NoEmployeeId:
                  value:
                    error: employee_id is required
                  summary: No employee_id
          description: '`employee_id` or `roles` is missing or malformed.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
              examples:
                UnknownEmployee:
                  value:
                    detail: Employee 999 not found
                  summary: Unknown employee
          description: No such brand, or no such employee.
  /api/v1/brands/{brand_pk}/employees/{id}:
    get:
      operationId: brands_employees_retrieve
      description: 'Scoped to a brand they hold a job at when mounted under one: asking
        brand 2 for an employee who only works at brand 1 is a 404.'
      summary: Retrieve an employee
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the addressed row.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: No such employee, or none employed by this brand.
    put:
      operationId: brands_employees_update
      description: 'Edits the Job, not the employee''s name. Send `roles` and/or `status`;
        an empty body is a 400. Requires both ids in the URL: `PUT /api/v1/brands/{brand_pk}/employees/{id}`.
        A `brand_id` or `employee_id` in the body is accepted but ignored - the URL
        is authoritative.'
      summary: Re-assign an employee's job at a brand
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the addressed row.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmploymentRequest'
            examples:
              Promote:
                value:
                  roles: Manager
              Terminate:
                value:
                  status: terminated
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateEmploymentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateEmploymentRequest'
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employment'
          description: The updated Job and employee.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                EmptyBody:
                  value:
                    error: Nothing to update; send 'roles' and/or 'status'
                  summary: Empty body
          description: Neither `roles` nor `status` was sent, or no brand is in the
            URL.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: This employee holds no job at this brand.
  /api/v1/brands/{brand_pk}/schedules:
    get:
      operationId: brands_schedules_list
      description: 'Every schedule belonging to the brand in the URL. There is no
        cross-brand listing: a schedule is only ever addressed under its brand.'
      summary: List a brand's schedules
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schedule'
          description: ''
    post:
      operationId: brands_schedules_create
      description: '`POST /api/v1/brands/{brand_pk}/schedules` - the only way to open
        a schedule. `brand_id` is taken from the URL; a body key of that name is not
        read.'
      summary: Open a schedule for a brand
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
            examples:
              D/M/YYYYDate:
                value:
                  starting_date: 7/9/2026
                summary: D/M/YYYY date
              ISODate:
                value:
                  starting_date: '2026-09-07'
                summary: ISO date
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScheduleRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: Schedule created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                UnparseableDate:
                  value:
                    error: starting_date is required
                  summary: Unparseable date
          description: '`starting_date` is missing or unparseable.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: The brand named in the URL does not exist.
  /api/v1/brands/{brand_pk}/schedules/{id}:
    get:
      operationId: brands_schedules_retrieve
      description: 'Scoped to the brand in the URL: asking the wrong brand for a real
        schedule is a 404, not a hit.'
      summary: Retrieve a schedule
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: Primary key of the addressed row.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: No schedule with this id, or not under this parent.
  /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles:
    get:
      operationId: brands_schedules_roles_list
      description: |-
        Roles, always addressed under their schedule, itself under its brand.

        The only mount is ``brands/<id>/schedules/<id>/roles``, so both
        ``brand_pk`` and ``schedule_pk`` are always supplied and a role is only
        ever looked up within the schedule that owns it: asking the wrong schedule
        for a real role is a 404, not a hit.

        ``brand_pk`` is captured by the URL and so is passed to every method by
        DRF; a method omitting it would raise ``TypeError``. ``create`` also uses
        it, to resolve the schedule within the brand.
      summary: List the roles in a schedule
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
          description: ''
    post:
      operationId: brands_schedules_roles_create
      description: '`POST /api/v1/brands/{brand_pk}/schedules/{schedule_pk}/roles`.
        `schedule_id` is taken from the URL; a body key of that name is ignored. The
        schedule is resolved within the brand, so a schedule belonging to another
        brand is a 404. The role''s `name` is later matched against a position name
        when a shift under it is staffed.'
      summary: Add a role to a schedule
      parameters:
      - in: path
        name: brand_pk
        schema:
          type: integer
        description: Primary key of the brand in the URL.
        required: true
      - in: path
        name: schedule_pk
        schema:
          type: integer
        description: Primary key of the schedule in the URL.
        required: true
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
            examples:
              AddARole:
                value:
                  name: Barista
                summary: Add a role
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoleRequest'
        required: true
      security:
      - jwtHeaderAuth: []
      - jwtCookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: Role created.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                MissingName:
                  value:
